syntax = "proto3";
package profile_api.v1;

service ProfileService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc GetProfileById(GetProfileByIdRequest) returns (GetProfileByIdResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc SetGeo(SetGeoRequest) returns (SetGeoResponse);
  rpc UploadPhoto(UploadPhotoRequest) returns (UploadPhotoResponse);
  rpc DeletePhoto(DeletePhotoRequest) returns (DeletePhotoResponse);
  rpc GetPresignedUrl(GetPresignedUrlRequest) returns (GetPresignedUrlResponse);
  rpc SetPreferences(SetPreferencesRequest) returns (SetPreferencesResponse);
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);
  rpc ActivateSubscription(ActivateSubscriptionRequest) returns (ActivateSubscriptionResponse);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
}

message CreateProfileRequest {
  int64 telegram_id = 1;
  string name = 2;
  int32 age = 3;
  string city = 4;
  string bio = 5;
  Gender gender = 6;
  optional double latitude = 7;
  optional double longitude = 8;
}

message CreateProfileResponse {
  int64 profile_id = 1;
}

message GetProfileRequest {
  int64 telegram_id = 1;
}

message GetProfileResponse {
  bool found = 1;
  int64 profile_id = 2;
  string name = 3;
  int32 age = 4;
  string city = 5;
  string bio = 6;
  Gender gender = 7;
  repeated PhotoInfo photos = 8;
  optional double latitude = 9;
  optional double longitude = 10;
  SubscriptionTier subscription_tier = 11;
  optional int64 subscription_expires_at_seconds = 12;
}

message GetProfileByIdRequest {
  int64 profile_id = 1;
}

message GetProfileByIdResponse {
  bool found = 1;
  int64 profile_id = 2;
  int64 telegram_id = 3;
  string name = 4;
  int32 age = 5;
  string city = 6;
  string bio = 7;
  Gender gender = 8;
  optional double latitude = 9;
  optional double longitude = 10;
  bool is_active = 11;
  int64 boost_expires_at_seconds = 12;
  SubscriptionTier subscription_tier = 13;
  optional int64 subscription_expires_at_seconds = 14;
}

message PhotoInfo {
  int64 photo_id = 1;
  bool is_active = 2;
}

message UpdateProfileRequest {
  int64 telegram_id = 1;
  string name = 2;
  int32 age = 3;
  string city = 4;
  string bio = 5;
}

message UpdateProfileResponse {
  bool success = 1;
}

message SetGeoRequest {
  int64 telegram_id = 1;
  double latitude = 2;
  double longitude = 3;
}

message SetGeoResponse {
  bool success = 1;
}

message UploadPhotoRequest {
  int64 telegram_id = 1;
  bytes data = 2;
  string content_type = 3;
}

message UploadPhotoResponse {
  int64 photo_id = 1;
  string minio_key = 2;
}

message DeletePhotoRequest {
  int64 telegram_id = 1;
  int64 photo_id = 2;
}

message DeletePhotoResponse {
  bool success = 1;
}

message GetPresignedUrlRequest {
  int64 photo_id = 1;
}

message GetPresignedUrlResponse {
  string url = 1;
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

enum GenderPref {
  GENDER_PREF_UNSPECIFIED = 0;
  GENDER_PREF_MALE = 1;
  GENDER_PREF_FEMALE = 2;
  GENDER_PREF_ANY = 3;
}

enum SubscriptionTier {
  SUBSCRIPTION_TIER_UNSPECIFIED = 0;
  SUBSCRIPTION_TIER_FREE = 1;
  SUBSCRIPTION_TIER_PREMIUM = 2;
}

message SetPreferencesRequest {
  int64 telegram_id = 1;
  int32 age_min = 2;
  int32 age_max = 3;
  GenderPref gender_pref = 4;
  int32 max_distance_km = 5;
}

message SetPreferencesResponse {
  bool success = 1;
}

message GetPreferencesRequest {
  int64 telegram_id = 1;
}

message GetPreferencesResponse {
  bool found = 1;
  int32 age_min = 2;
  int32 age_max = 3;
  GenderPref gender_pref = 4;
  int32 max_distance_km = 5;
}

message ActivateSubscriptionRequest {
  int64 telegram_id = 1;
  SubscriptionTier tier = 2;
  int64 duration_seconds = 3;
  string telegram_payment_charge_id = 4;
  string provider_payment_charge_id = 5;
  string invoice_payload = 6;
}

message ActivateSubscriptionResponse {
  bool success = 1;
  int64 subscription_expires_at_seconds = 2;
}
